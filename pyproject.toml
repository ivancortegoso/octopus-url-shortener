[project]
name = "url-shortener"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.2",
    "segno>=1.6.6",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
python_files = ["test_*.py"]
addopts = "-q"
